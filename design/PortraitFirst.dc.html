<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Great+Vibes&display=swap">
  <style>
    body { margin: 0; font-family: "Karla", "Segoe UI", Arial, sans-serif; background: #FDFCF7; }
    a { color: #D6A22B; } a:hover { color: #B5851F; }
  </style>
</helmet>

<!-- Alternate hero direction: portrait centred and dominant, the name set
     beneath it like a plate caption. Quieter and more formal than the split. -->
<div style="width: 1440px; background: #FDFCF7; color: #23301F;">

  <div style="position: relative; background: #FDFCF7; overflow: hidden; padding: 116px 0 104px;">

    <!-- a single wide gold rule sits behind the portrait, breaking the symmetry -->
    <div style="position: absolute; left: 0; right: 0; top: 300px; height: 1px; background: rgba(214,162,43,0.4);"></div>

    <div style="position: relative; max-width: 74rem; margin-inline: auto; padding-inline: 3.5rem; display: flex; flex-direction: column; align-items: center; gap: 2.2rem;">

      <p style="margin: 0; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; color: #D6A22B;">Meet our founder</p>

      <!-- the portrait leads; deep forest plate so it holds against cream -->
      <div style="position: relative;">
        <div style="position: absolute; inset: -16px; border: 1px solid rgba(214,162,43,0.5); border-radius: 4px;"></div>
        <div style="position: relative; width: 420px; height: 500px; border-radius: 3px; overflow: hidden; background: linear-gradient(168deg, #24402A 0%, #142619 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;">
          <svg width="82" height="82" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8.6" r="3.9" stroke="rgba(240,206,114,0.5)" stroke-width="1.1"></circle>
            <path d="M4.6 20.4c0-3.9 3.3-6.6 7.4-6.6s7.4 2.7 7.4 6.6" stroke="rgba(240,206,114,0.5)" stroke-width="1.1" stroke-linecap="round"></path>
          </svg>
          <span style="font-size: 0.68rem; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(240,206,114,0.62); text-align: center;">[Founder portrait]</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 0.9rem; text-align: center;">
        <h1 style="font-family: 'Marcellus', Georgia, serif; font-weight: 400; font-size: 3.6rem; line-height: 1.08; letter-spacing: -0.015em; color: #1F3A24; margin: 0;">
          M. S. Tamilselvan
        </h1>

        <div style="display: flex; align-items: center; gap: 1rem;">
          <span style="width: 38px; height: 1px; background: #D6A22B;"></span>
          <span style="font-size: 0.76rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #A87A22;">Founder &amp; Chairman</span>
          <span style="width: 38px; height: 1px; background: #D6A22B;"></span>
        </div>
      </div>

      <blockquote style="margin: 0; max-width: 42rem; text-align: center; font-family: 'Marcellus', Georgia, serif; font-weight: 400; font-size: 2rem; line-height: 1.38; color: #55604F; text-wrap: balance;">
        &ldquo;Build capabilities today that create scale for tomorrow.&rdquo;
      </blockquote>

      <div style="display: flex; gap: 1rem; padding-top: 0.6rem;">
        <a href="#" style="display: inline-flex; align-items: center; gap: 10px; background: #6E1B22; color: #F4E6CD; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; padding: 16px 30px; border-radius: 4px; text-decoration: none;">
          Read his story
        </a>
        <a href="#" style="display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(74,44,34,0.45); color: #1F3A24; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; padding: 16px 30px; border-radius: 4px; text-decoration: none; background: transparent;">
          Our heritage
        </a>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
