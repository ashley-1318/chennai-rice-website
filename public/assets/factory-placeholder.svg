  <!-- trees -->
  <circle cx="90" cy="392" r="34" fill="#6E7A3A" fill-opacity="0.35"/>
  <circle cx="160" cy="398" r="26" fill="#6E7A3A" fill-opacity="0.35"/>
  <circle cx="1520" cy="396" r="30" fill="#6E7A3A" fill-opacity="0.35"/>
  <circle cx="1440" cy="400" r="22" fill="#6E7A3A" fill-opacity="0.35"/>
  <circle cx="700" cy="404" r="20" fill="#6E7A3A" fill-opacity="0.35"/>

  <!-- foreground road -->
  <rect x="0" y="470" width="1600" height="46" fill="#CBB994"/>
  <g stroke="#F7F2E6" stroke-width="4" stroke-dasharray="34 30">
    <path d="M0 493 L1600 493"/>
  </g>
</svg>
