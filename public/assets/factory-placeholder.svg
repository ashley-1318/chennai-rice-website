    <rect x="541" y="338" width="80" height="5" fill="#A8956F" fill-opacity="0.5"/>
    <ellipse cx="581" cy="410" rx="40" ry="8" fill="#C6B693"/>
  </g>
  <g>
    <rect x="635" y="300" width="80" height="110" fill="url(#silo)"/>
    <path d="M631 300 L675 264 L719 300 Z" fill="#B9A87F"/>
    <rect x="635" y="338" width="80" height="5" fill="#A8956F" fill-opacity="0.5"/>
    <ellipse cx="675" cy="410" rx="40" ry="8" fill="#C6B693"/>
  </g>
  <g>
    <rect x="729" y="300" width="80" height="110" fill="url(#silo)"/>
    <path d="M725 300 L769 264 L813 300 Z" fill="#B9A87F"/>
    <rect x="729" y="338" width="80" height="5" fill="#A8956F" fill-opacity="0.5"/>
    <ellipse cx="769" cy="410" rx="40" ry="8" fill="#C6B693"/>
  </g>
  <g>
    <rect x="823" y="300" width="80" height="110" fill="url(#silo)"/>
    <path d="M819 300 L863 264 L907 300 Z" fill="#B9A87F"/>
    <rect x="823" y="338" width="80" height="5" fill="#A8956F" fill-opacity="0.5"/>
    <ellipse cx="863" cy="410" rx="40" ry="8" fill="#C6B693"/>
