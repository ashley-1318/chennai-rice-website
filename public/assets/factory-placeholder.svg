    <path d="M161 300 L205 264 L249 300 Z" fill="#B9A87F"/>
    <rect x="165" y="338" width="80" height="5" fill="#A8956F" fill-opacity="0.5"/>
    <ellipse cx="205" cy="410" rx="40" ry="8" fill="#C6B693"/>
  </g>
  <g>
    <rect x="259" y="300" width="80" height="110" fill="url(#silo)"/>
    <path d="M255 300 L299 264 L343 300 Z" fill="#B9A87F"/>
