<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Illustration of the Chennai Rice milling plant: a row of grain silos beside long processing sheds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F3EBDB"/>
    </linearGradient>
    <linearGradient id="silo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9B896"/>
      <stop offset="0.35" stop-color="#EFE6D2"/>
      <stop offset="1" stop-color="#BFAE8C"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3B0"/>
      <stop offset="1" stop-color="#D6C298"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" fill="url(#sky)"/>

  <!-- distant hills -->
  <path d="M0 300 C170 250 300 288 430 272 C560 256 660 214 810 240 C960 266 1060 244 1200 258 C1330 271 1460 250 1600 268 L1600 330 L0 330 Z" fill="#A87A22" fill-opacity="0.16"/>
  <path d="M0 330 C200 300 360 330 520 318 C700 305 830 276 1010 300 C1180 322 1350 306 1600 322 L1600 380 L0 380 Z" fill="#A87A22" fill-opacity="0.10"/>

  <!-- ground -->
  <rect x="0" y="368" width="1600" height="252" fill="url(#ground)"/>
  <path d="M0 368 L1600 368 L1600 392 L0 400 Z" fill="#C9A44C" fill-opacity="0.35"/>

  <!-- long processing sheds, right: solid bodies with pitched roofs -->
  <g>
    <rect x="985" y="332" width="575" height="72" fill="#F7F2E6" stroke="#D8C9A8" stroke-width="2"/>
    <path d="M972 334 L1272 290 L1572 334 Z" fill="#8A2A31"/>
    <g fill="#E3D8BE">
      <rect x="1020" y="352" width="26" height="34"/><rect x="1070" y="352" width="26" height="34"/>
      <rect x="1120" y="352" width="26" height="34"/><rect x="1170" y="352" width="26" height="34"/>
      <rect x="1220" y="352" width="26" height="34"/><rect x="1270" y="352" width="26" height="34"/>
      <rect x="1320" y="352" width="26" height="34"/><rect x="1370" y="352" width="26" height="34"/>
    </g>
    <rect x="880" y="366" width="430" height="44" fill="#FDFBF5" stroke="#D8C9A8" stroke-width="2"/>
    <path d="M868 368 L1095 336 L1322 368 Z" fill="#6E1B22"/>
  </g>

  <!-- grain silos -->
  <g>
